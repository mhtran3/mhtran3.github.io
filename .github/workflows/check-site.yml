# Runs the site's own checks on every push and pull request, so a broken link, a missing
# file, an over-budget asset or a stale ?v= stamp is caught before it reaches the live site.
name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links, IDs, videos and file sizes
        run: python scripts/check-site.py > /dev/null
      - name: Stylesheet and script links carry current hashes
        run: |
          python scripts/stamp-assets.py
          git diff --exit-code -- '*.html' || { echo "::error::Run scripts/stamp-assets.py and commit the updated pages."; exit 1; }
