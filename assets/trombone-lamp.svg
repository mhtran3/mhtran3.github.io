<svg xmlns="http://www.w3.org/2000/svg" width="160" height="400" viewBox="0 0 160 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- A trombone slide reused as a wall lamp, after the one at The Leaf: two parallel
       tubes joined by a U-bend, a gooseneck at the top, and the bell turned into a shade. -->
  <defs>
    <linearGradient id="brass" x1="0" x2="1">
      <stop offset="0" stop-color="#6f5533"/><stop offset=".45" stop-color="#c6a165"/>
      <stop offset=".6" stop-color="#e3c78f"/><stop offset="1" stop-color="#7d6039"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" x2="1">
      <stop offset="0" stop-color="#5f4729"/><stop offset=".35" stop-color="#a98450"/>
      <stop offset=".55" stop-color="#d8b97f"/><stop offset=".8" stop-color="#9a7646"/><stop offset="1" stop-color="#5a4327"/>
    </linearGradient>
    <filter id="painted" x="-10%" y="-5%" width="120%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>
  <g filter="url(#painted)" stroke-linecap="round" fill="none">
    <!-- Wall bracket and pulley -->
    <path d="M30 2h12v26H30z" fill="#2d2620"/>
    <path d="M42 12H70" stroke="#2d2620" stroke-width="4"/>
    <circle cx="74" cy="16" r="8" stroke="#8c6d42" stroke-width="3" fill="#3a3027"/>
    <circle cx="74" cy="16" r="2" fill="#c6a165"/>
    <!-- The pull cord: tied off at the bracket, over the pulley, then hanging free.
         The page continues it straight down from (82, 24). -->
    <path d="M52 10.5L72 7.4A8.6 8.6 0 0 1 82 16V24" stroke="#3a2f25" stroke-width="2.6"/>
    <circle cx="52" cy="10.5" r="2.4" fill="#3a2f25" stroke="none"/>
    <!-- Slide: two tubes, braces, and the U-bend -->
    <path d="M62 78V360Q62 378 68 378Q74 378 74 360V78" stroke="url(#brass)" stroke-width="6"/>
    <path d="M60.5 84V356M72.5 84V356" stroke="#f1dcae" stroke-width="1" opacity=".55"/>
    <path d="M60 104H76M60 338H76" stroke="#8a6a3e" stroke-width="3.5"/>
    <!-- Clamps holding it to the wall -->
    <path d="M44 150H62M44 292H62" stroke="#2d2620" stroke-width="3.5"/>
    <path d="M42 144v12M42 286v12" stroke="#2d2620" stroke-width="4"/>
    <!-- Gooseneck over to the shade -->
    <path d="M74 80V60C74 20 128 16 128 54V66" stroke="url(#brass)" stroke-width="6"/>
    <path d="M76 62C77 30 120 26 125 52" stroke="#f1dcae" stroke-width="1" opacity=".5"/>
    <!-- Socket and bell -->
    <path d="M122 64h12v12h-12z" fill="#7d6039" stroke="none"/>
    <path d="M121 76C120 92 111 103 104 114H152C145 103 136 92 135 76Z" fill="url(#bell)" stroke="none"/>
    <path d="M124 80C123 94 117 104 112 112" stroke="#f3e0b4" stroke-width="1.4" opacity=".55"/>
    <ellipse cx="128" cy="114" rx="24" ry="4.8" fill="#3a2a1b" stroke="#b9945c" stroke-width="1.6"/>
  </g>
</svg>
