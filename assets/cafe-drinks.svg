<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Painted, not drawn: a slight wobble on every edge and a dry-brush grain, so the
       drinks sit with the gouache branches instead of reading as flat icons. -->
  <defs>
    <filter id="gouache" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="4" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="3.2" result="painted"/>
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="9" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 .22  0 0 0 0 .16  0 0 0 0 .1  0 0 0 -.7 .3" result="speck"/>
      <feComposite in="speck" in2="painted" operator="in" result="speckOnPaint"/>
      <feMerge><feMergeNode in="painted"/><feMergeNode in="speckOnPaint"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#gouache)">
    <!-- Iced matcha on a dark wooden saucer, as served at The Leaf. -->
    <g transform="translate(92 0)">
      <ellipse cx="0" cy="184" rx="66" ry="10" fill="#2f241c"/>
      <ellipse cx="0" cy="181" rx="62" ry="8" fill="#4a3829"/>
      <ellipse cx="0" cy="181" rx="46" ry="5" fill="none" stroke="#6b5440" stroke-width="1.2"/>
      <path d="M-38 58L-31 178Q0 186 31 178L38 58Z" fill="#dfe3cf" opacity=".55"/>
      <path d="M-36 96Q-18 92 0 99T36 95L31 177Q0 185-31 177Z" fill="#ece3c6"/>
      <path d="M-37 74Q-18 70 0 77T37 73L36 101Q18 106 0 99T-36 103Z" fill="#9fb46f"/>
      <path d="M-36 98Q-14 108 4 100T36 99" fill="none" stroke="#c5d09b" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <path d="M-31 112L-27 168" stroke="#fffaf0" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <ellipse cx="0" cy="58" rx="38" ry="5.5" fill="#eef0e2" opacity=".8"/>
      <path d="M14 66L30 8" stroke="#6f7e58" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Egg coffee: the cup rests in a small bowl of hot water to keep it warm. -->
    <g transform="translate(250 0)">
      <path d="M-70 146Q-66 186 0 188Q66 186 70 146Z" fill="#d9d1bd"/>
      <path d="M-70 146Q-66 186 0 188Q66 186 70 146" fill="none" stroke="#a99f86" stroke-width="1.5"/>
      <ellipse cx="0" cy="146" rx="70" ry="11" fill="#b9c6c2"/>
      <ellipse cx="0" cy="146" rx="62" ry="8" fill="#a3b4b1"/>
      <path d="M-34 104L-29 150Q0 158 29 150L34 104Z" fill="#f3ecdc"/>
      <path d="M-34 104L-29 150Q0 158 29 150L34 104" fill="none" stroke="#c9bfa8" stroke-width="1.2"/>
      <path d="M33 114C56 112 54 140 31 139" fill="none" stroke="#e9e0cc" stroke-width="7"/>
      <ellipse cx="0" cy="104" rx="34" ry="7" fill="#e7c47c"/>
      <ellipse cx="-4" cy="103" rx="22" ry="3.6" fill="#f2d79b"/>
      <path d="M-9 104Q-2 101 6 104" fill="none" stroke="#c99b55" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-46 152Q-30 158-12 156" fill="none" stroke="#e7efe9" stroke-width="2" stroke-linecap="round" opacity=".7"/>
      <g fill="none" stroke="#a89a82" stroke-width="2" stroke-linecap="round" opacity=".45"><path d="M-8 84C-17 72 2 66-5 54M10 86C3 76 18 70 13 61"/></g>
    </g>
  </g>
</svg>
