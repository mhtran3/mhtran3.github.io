<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Hand-troweled plaster: broad soft mottling and a little grit, multiplied over the wall colour. -->
  <filter id="trowel" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".011 .016" numOctaves="4" seed="21" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .22  1.1 0 0 0 -.38"/>
  </filter>
  <filter id="grit" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .24  0 0 0 0 .16  0 0 0 -1.4 .9"/>
  </filter>
  <rect width="320" height="320" filter="url(#trowel)" opacity=".55"/>
  <rect width="320" height="320" filter="url(#grit)" opacity=".18"/>
</svg>
